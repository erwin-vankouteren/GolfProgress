name: Android

# Builds and tests the Android client. Called by ci.yml when the Android client or the
# API spec changes (#59, #65); can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: clients/android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The committed gradle-wrapper.jar is executable code: check it matches an official
      # Gradle release before running it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The API client, then the app: ktlint, Android Lint, the unit and Compose UI tests
      # (Robolectric, on the JVM) and a debug APK. Unit tests run on the debug variant,
      # where the Compose test activity is declared.
      - name: Build and test
        run: >-
          ./gradlew
          :api-client:build
          :app:ktlintCheck
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
