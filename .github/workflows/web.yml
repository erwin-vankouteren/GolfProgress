name: Web

# Type-checks and tests the web client. Called by ci.yml when the web client or the API
# spec changes (#59, #63); can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: clients/web

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: clients/web/.nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      # Also generates src/api/schema.d.ts from api/openapi.json (postinstall), so the
      # client is always typed by the current contract.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
