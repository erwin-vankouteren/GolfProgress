name: Deploy API to an environment

# Called by api-deploy.yml, once per environment: applies the database migrations, then
# publishes the app (#115, #123). No stored Azure credentials: GitHub signs in through
# OpenID Connect as an Entra app with a federated credential for that environment.
# Setup, settings and secrets: docs/deployment.md → "API".
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds the secrets and variables, e.g. production.
        type: string
        required: true
      prefix:
        description: "Its variables' prefix, e.g. PRODUCTION for PRODUCTION_API_URL."
        type: string
        required: true

permissions:
  contents: read
  id-token: write # for the OpenID Connect sign-in to Azure

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars[format('{0}_API_URL', inputs.prefix)] }}

    # One deployment per environment at a time; a newer one waits rather than racing it.
    concurrency:
      group: deploy-api-${{ inputs.environment }}
      cancel-in-progress: false

    # The migration bundle starts the app to find the database context, and the app refuses
    # to start without these. Placeholders only: the bundle connects with --connection below.
    env:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=placeholder
      Jwt__Key: placeholder-only-used-to-start-the-migration-bundle
      API_APP_NAME: ${{ vars[format('{0}_API_APP_NAME', inputs.prefix)] }}
      API_URL: ${{ vars[format('{0}_API_URL', inputs.prefix)] }}
      SQL_SERVER: ${{ vars[format('{0}_SQL_SERVER', inputs.prefix)] }}

    steps:
      - name: Check the environment's variables
        run: |
          for v in API_APP_NAME API_URL SQL_SERVER; do
            test -n "${!v}" || { echo "::error::Set the ${{ inputs.prefix }}_$v variable on the ${{ inputs.environment }} environment."; exit 1; }
          done

      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        run: dotnet publish src/GolfProgress.Api -c Release -o publish

      # A self-contained executable that applies any pending migrations, and only those.
      - name: Build the migration bundle
        run: >
          dotnet ef migrations bundle
          --project src/GolfProgress.Infrastructure
          --startup-project src/GolfProgress.Api
          --configuration Release
          --output efbundle
          --force

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # As the deploy identity, a member of the SQL admin group: the only identity that may
      # change the schema. The API itself can only read and write data (db/README.md).
      - name: Apply migrations
        run: ./efbundle --connection "Server=tcp:$SQL_SERVER,1433;Initial Catalog=GolfProgressDb;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: publish

      # App Service starts the new version in a fresh container, and staging's serverless
      # database may be waking up; until then the old version or a placeholder 404 answers.
      # The first deployment took over a minute, so allow three before calling it broken.
      - name: Check it answers
        run: curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors "$API_URL/client-config"
