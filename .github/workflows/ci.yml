name: CI

# The single entry point for CI (#59). It works out which areas a change touches, runs
# only those workflows, and reports one combined result.
#
# Why one workflow instead of path filters on each: a path-filtered workflow that
# doesn't run never reports a status, so it can't be a required check -- a pull request
# that skipped it would wait forever. Here every run ends with "CI result", which always
# reports, and is the one check to require if branch protection is turned on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Scoped to main on push, so a PR branch isn't built twice (once for the push and once
# for the pull_request event). A newer push to the same ref supersedes the one before
# it; cancelling the older run keeps it from being billed to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.areas.outputs.api }}
      web: ${{ steps.areas.outputs.web }}
      android: ${{ steps.areas.outputs.android }}
      ios: ${{ steps.areas.outputs.ios }}
      design: ${{ steps.areas.outputs.design }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The comparison needs the base commit as well as the head.
          fetch-depth: 0

      - name: Detect changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/changed-areas.sh "$PR_BASE" "$GITHUB_SHA" ;;
            push)         bash .github/scripts/changed-areas.sh "$PUSH_BEFORE" "$GITHUB_SHA" ;;
            *)            bash .github/scripts/changed-areas.sh --all ;;
          esac | tee -a "$GITHUB_OUTPUT"

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api.yml

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml

  design:
    name: Design
    needs: changes
    if: needs.changes.outputs.design == 'true'
    uses: ./.github/workflows/design.yml

  result:
    name: CI result
    needs: [changes, api, web, android, ios, design]
    # Always runs, so there is always a status to require. Areas that didn't need to
    # run count as passed; anything that failed or was cancelled fails the result.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every area that ran
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
