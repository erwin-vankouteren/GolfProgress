name: Android release (internal testing)

# Builds the signed release app bundle and uploads it to Google Play's internal testing
# track (#118), for a tag such as android-v1.2.0 or when started by hand.
# Setup, secrets and variables: docs/clients/android-release.md.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-internal

    defaults:
      run:
        working-directory: clients/android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The same checks as CI, since a tag can point anywhere.
      - name: Test
        run: ./gradlew :api-client:build :app:ktlintCheck :app:testDebugUnitTest

      # The upload key, written to the runner's temp directory and gone with the runner.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Set the ANDROID_UPLOAD_KEYSTORE_BASE64 secret."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # versionCode: this workflow's run number, so every upload is higher than the last.
      # versionName: the tag without "android-v", or the run number when started by hand.
      - name: Build the release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_URL: ${{ vars.STAGING_API_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: |
          case "$API_URL" in https://*) ;; *) echo "::error::Set STAGING_API_URL to the staging API's https:// address."; exit 1;; esac
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then name="${GITHUB_REF#refs/tags/android-v}"; else name="0.0.${{ github.run_number }}"; fi
          ./gradlew :app:bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="$name" \
            -PapiBaseUrl="$API_URL" \
            -PprivacyPolicyUrl="$PRIVACY_POLICY_URL" \
            -PtermsUrl="$TERMS_URL"

      - name: Upload to the internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.golfprogress.app
          releaseFiles: clients/android/app/build/outputs/bundle/release/app-release.aab
          # R8's mapping, so Play Console shows readable stack traces.
          mappingFile: clients/android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      - name: Keep the mapping file
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.run_number }}
          path: clients/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
