name: Deploy web

# After CI passes on main (#116, #123): to staging, then, once someone approves it, the
# same commit to production. The approval is a required reviewer on the GitHub
# environment `production`. Setup: docs/deployment.md → "Web app".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    # Only after a green CI run for a push to this repository's main (or when started by
    # hand). `branches: [main]` alone also matches a pull request from a fork whose branch
    # is called main, which would deploy the fork's code with the deployment credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/web-deploy-environment.yml
    with:
      environment: staging
      prefix: STAGING
    secrets: inherit

  # Waits for a reviewer to approve it; a run nobody approves expires after 30 days.
  production:
    name: Production
    needs: staging
    uses: ./.github/workflows/web-deploy-environment.yml
    with:
      environment: production
      prefix: PRODUCTION
    secrets: inherit
